name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every commit gets a run of its own, and a newer push never cancels one
# that is under way: each commit is checked to the end.
concurrency:
  group: check-${{ github.sha }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  clang:
    name: clang ${{ matrix.llvm }}, libc++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [23]
    steps:
      # The whole history, so that each file's time can be the time of the
      # commit that last changed it (below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The build directory and the fetched sources kept between runs. ninja
      # decides what to rebuild from the times of files, and a checkout
      # stamps every file with now -- so each file is given the time of the
      # last commit that changed it, and what a run restores is only rebuilt
      # where something it was built from changed since.
      - name: file times from the history
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            when=$(git log -1 --format=%ct -- "$file")
            [ -n "$when" ] && touch -d "@$when" "$file"
          done

      # Clang and libc++, which is where `import std` comes from.
      - name: clang and libc++
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ninja-build lsb-release software-properties-common gnupg curl
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y libc++-${{ matrix.llvm }}-dev libc++abi-${{ matrix.llvm }}-dev libclang-rt-${{ matrix.llvm }}-dev

      - name: cmake
        run: |
          version=4.4.3
          curl -sSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-x86_64.tar.gz"
          sudo tar xzf cmake.tar.gz -C /opt
          echo "/opt/cmake-${version}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # CMake works out where the std module's source is from where the
      # compiler is, and the compiler a distribution installs is a link in a
      # directory that says nothing about its toolchain: the answer is
      # /lib/share/libc++/v1, which no package fills. So both ends are said
      # outright.
      - name: where import std is read from
        run: |
          sudo mkdir -p /lib/share/libc++
          sudo ln -sfn /usr/lib/llvm-${{ matrix.llvm }}/share/libc++/v1 /lib/share/libc++/v1
          sudo ln -sf /usr/lib/llvm-${{ matrix.llvm }}/bin/clang++ /usr/local/bin/clang++
          test -f /lib/share/libc++/v1/std.cppm

      # A nightly compiler cannot read a previous build's module binaries.
      - name: compiler and standard library identity
        run: |
          digest=$({ /usr/local/bin/clang++ --version; sha256sum /lib/share/libc++/v1/std.cppm; } | sha256sum | cut -c1-16)
          echo "COMPILER_BUILD=$digest" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            build
            .cache/cpm
          key: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-clang${{ matrix.llvm }}-${{ env.COMPILER_BUILD }}-

      - name: build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-${{ matrix.llvm }}/bin/clang \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DQUAY_CONSTEXPR_STEPS=2000000000 \
            -DQUAY_LIVE_TESTS=ON
          cmake --build build

      # A real router for the live test: smp-server, its release, on
      # 127.0.0.1:15223; the tests reach it by quay.tls, through
      # OpenSSL, that gives the test the peer chain and the channel binding.
      - name: smp-server
        run: |
          version=v6.5.0
          curl -sSL -o /tmp/smp-server "https://github.com/simplex-chat/simplexmq/releases/download/${version}/smp-server-ubuntu-24_04-x86-64"
          chmod +x /tmp/smp-server
          sudo /tmp/smp-server init --ip 127.0.0.1 --no-password --disable-web -y
          sudo sed -i 's/^port = .*/port = 15223/; s/^host = .*/host = 127.0.0.1/' /etc/opt/simplex/smp-server.ini
          sudo nohup /tmp/smp-server start > /tmp/smp-server.log 2>&1 &
          for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/15223) 2>/dev/null && break; sleep 0.2; done
          echo "QUAY_SMP_FINGERPRINT=$(sudo cat /etc/opt/simplex/fingerprint)" >> "$GITHUB_ENV"
          echo "QUAY_SMP_ADDRESS=127.0.0.1:15223" >> "$GITHUB_ENV"
          # xftp-server, its files router, on 15443 (Ed448 certificates, as it makes them).
          curl -sSL -o /tmp/xftp-server "https://github.com/simplex-chat/simplexmq/releases/download/${version}/xftp-server-ubuntu-24_04-x86-64"
          chmod +x /tmp/xftp-server
          sudo mkdir -p /tmp/xftp-files
          sudo /tmp/xftp-server init -p /tmp/xftp-files -q 1gb --ip 127.0.0.1 < /dev/null
          sudo sed -i 's/^port = .*/port = 15443/' /etc/opt/simplex-xftp/file-server.ini
          sudo nohup /tmp/xftp-server start > /tmp/xftp-server.log 2>&1 &
          for i in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/15443) 2>/dev/null && break; sleep 0.2; done
          echo "QUAY_XFTP_FINGERPRINT=$(sudo cat /etc/opt/simplex-xftp/fingerprint)" >> "$GITHUB_ENV"
          # simplexmq's own xftp client, for live_xfile.
          curl -sSL -o /tmp/xftp "https://github.com/simplex-chat/simplexmq/releases/download/${version}/xftp-ubuntu-24_04-x86-64"
          chmod +x /tmp/xftp
          echo "QUAY_XFTP_CLI=/tmp/xftp" >> "$GITHUB_ENV"
          # simplex-chat's CLI on that router, its WebSocket API on 5225, for
          # the tests that join its invitations and invite it.
          curl -sSL -o /tmp/simplex-chat "https://github.com/simplex-chat/simplex-chat/releases/download/v7.1.4/simplex-chat-ubuntu-24_04-x86_64"
          chmod +x /tmp/simplex-chat
          mkdir -p /tmp/chat
          fingerprint=$(sudo cat /etc/opt/simplex/fingerprint)
          (cd /tmp/chat && HOME=/tmp/chat setsid nohup /tmp/simplex-chat -d /tmp/chat/cli --user-display-name cli \
            -s "smp://${fingerprint}@127.0.0.1:15223" --xftp-server "xftp://$(sudo cat /etc/opt/simplex-xftp/fingerprint)@127.0.0.1:15443" --smp-proxy never -p 5225 -y < /dev/null > /tmp/chat/cli.log 2>&1 &)
          for i in $(seq 1 100); do (exec 3<>/dev/tcp/127.0.0.1/5225) 2>/dev/null && break; sleep 0.3; done
          (exec 3<>/dev/tcp/127.0.0.1/5225) 2>/dev/null || { echo "the CLI did not start"; cat /tmp/chat/cli.log; exit 1; }

      - name: test
        run: ctest --test-dir build --output-on-failure
